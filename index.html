<!DOCTYPE html>
<html lang = "en">

<head>
  <meta charset = "utf-8">
  <title>Think Outside the Box</title>

<style>
  body {
    font-family: Hedvig, Letters, serif;
    background-color: #634686;
    color: #FF9500;
    margin: 40px;
  }

  div {
    font-size: 45px;
    font-weight: bold;
    margin-top: (100vh) - 45px;
    margin-bottom: 0px;
  }

  div span {
    font-size: 180px;
    letter-spacing: 20px;
    margin-top: (100vh) - 180px;
  
  h1 {
    font-size: 180px;
    letter-spacing: 20px;
    margin-top: 20px;
    margin-bottom: 20px;
  }

  .offset {
    margin-left: 180px;
    transform: rotate(-4deg);
  }

  h1 span {
    display: inline-block;
    transform: rotate(12deg);
  }
    
</style>

<body>

  <div>Think outside the <span>BOX</span></div>
    
</body>

</html>
